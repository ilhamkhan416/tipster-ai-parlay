name: Daily FIXSCORE Scraping & Groq AI Pipeline

on:
  schedule:
    - cron: '50 2 * * *'
  workflow_dispatch:

jobs:
  run-fixscore-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: Install Playwright Browsers
        run: |
          playwright install chromium

      - name: Step 1 - Scrape Web Parlay
        run: |
          python src/scrape_parlay.py

      - name: Step 2 - Filter Algoritma & Generasi Groq AI
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python src/main.py

      - name: Step 3 - Auto Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: auto update daily parlay recommendations [skip ci]" || echo "Tidak ada perubahan data"
          git push
