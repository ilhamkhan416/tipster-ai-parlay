name: Parlay AI Receipt Generator

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 06:00 WIB (23:00 UTC)
    - cron: '0 23 * * *'
  workflow_dispatch: # Tombol manual 'Run workflow'

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright google-generativeai

      - name: Install Playwright Browsers (Chromium)
        run: |
          python -m playwright install chromium --with-deps

      - name: 1. Scrape Mainbolakaki & Deep Flashscore
        run: |
          python src/scrape_parlay.py

      - name: 2. Enrich Data (Matching & Combine)
        run: |
          python src/enrich_data.py

      - name: 3. AI Analysis (Gemini/Groq)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/main.py

      - name: 4. Generate Receipt HTML
        run: |
          python src/generate_receipt.py

      - name: Commit and Push Updated HTML & Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          git commit -m "Auto-update Parlay Receipt & Flashscore Data [skip ci]" || exit 0
          git push
