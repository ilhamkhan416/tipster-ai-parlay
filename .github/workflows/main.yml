name: Daily FIXSCORE Scraping & Gemini AI Pipeline

on:
  schedule:
    # Berjalan otomatis 1x sehari pukul 10:50 WIB (02:50 UTC)
    - cron: '50 2 * * *'
  workflow_dispatch: # Mengizinkan pemicu manual kapan saja dari tab Actions

jobs:
  run-fixscore-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright google-genai requests

      - name: Install Playwright Browsers (Chromium)
        run: |
          playwright install chromium

      - name: Step 1 - Scrape Web Parlay (Playwright)
        run: |
          python src/scrape_parlay.py

      - name: Step 2 - Filter Algoritma & Generasi Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/main.py

      - name: Step 3 - Auto Commit & Push Changes to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: auto update daily parlay recommendations [skip ci]" || echo "Tidak ada perubahan data untuk di-commit"
          git push
