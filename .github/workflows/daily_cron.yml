name: Daily Fixscore Automation Cron

on:
  schedule:
    # Berjalan otomatis setiap jam 03:30 UTC (10:30 WIB)
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Engine Script
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "Fixscore-Bot"
          git config --global user.email "bot@fixscore.local"
          git add data/today.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update 10 partai harian [Cron]" && git push)
