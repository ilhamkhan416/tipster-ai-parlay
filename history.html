<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Win Rate - ParlayIQ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sbobet: {
              bg: '#0c192c',
              card: '#162a45',
              header: '#112238',
              accent: '#ffb800',
              border: '#233a5e',
              green: '#00e676',
              red: '#ff5252'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-sbobet-bg text-slate-100 min-h-screen font-sans">

  <header class="bg-sbobet-header border-b border-sbobet-border sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-2xl font-black tracking-wider text-sbobet-accent">PARLAY<span class="text-white">IQ</span></span>
      </div>
      <nav class="flex space-x-4 text-sm font-semibold">
        <a href="index.html" class="text-slate-300 hover:text-white transition">Hari Ini</a>
        <a href="history.html" class="text-sbobet-accent border-b-2 border-sbobet-accent pb-1">Riwayat Win Rate</a>
      </nav>
    </div>
  </header>

  <section class="max-w-5xl mx-auto px-4 pt-6 pb-4 text-center">
    <h1 class="text-2xl md:text-3xl font-bold text-white uppercase">Transparansi Win Rate</h1>
    <p class="text-slate-300 text-xs md:text-sm mt-1">Rekam jejak dan hasil skor pertandingan kemarin secara jujur.</p>
  </section>

  <main class="max-w-5xl mx-auto px-4 pb-16">
    <div id="history-container" class="space-y-3">
      <div class="p-5 bg-sbobet-card rounded border border-sbobet-border animate-pulse h-24"></div>
    </div>
  </main>

  <script src="history.js"></script>
</body>
</html>
