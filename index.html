<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParlayIQ - Analisis Prediksi Sepak Bola Kuantitatif</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pro: {
              bg: '#0f172a',       /* Slate 900 - Latar Belakang Gelap Solid */
              card: '#1e293b',     /* Slate 800 - Kartu Kontras Tinggi */
              header: '#020617',   /* Slate 950 - Navbar & Header */
              border: '#334155',   /* Slate 700 - Border Garis Tipis */
              accent: '#38bdf8',   /* Sky Blue - Aksen Utama */
              highlight: '#f59e0b',/* Amber/Gold - Highlight Odds */
              green: '#10b981'     /* Emerald Green - Win Rate */
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-pro-bg text-slate-100 min-h-screen font-sans antialiased">

  <!-- Navbar Profesional -->
  <header class="bg-pro-header border-b border-pro-border sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-xl font-bold tracking-tight text-white">PARLAY<span class="text-pro-accent">IQ</span></span>
        <span class="hidden sm:inline-block text-[11px] bg-pro-card text-slate-300 px-2 py-0.5 rounded border border-pro-border font-medium">Sports Analytics</span>
      </div>
      <nav class="flex space-x-6 text-sm font-medium">
        <a href="index.html" class="text-pro-accent border-b-2 border-pro-accent pb-1">Hari Ini</a>
        <a href="history.html" class="text-slate-400 hover:text-white transition">Riwayat Win Rate</a>
      </nav>
    </div>
  </header>

  <!-- Hero Section & Stats Bar -->
  <section class="max-w-5xl mx-auto px-4 pt-8 pb-6">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-pro-card p-5 rounded-lg border border-pro-border">
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-white tracking-wide">10 PARTAI TERPILIH HARI INI</h1>
        <p class="text-slate-400 text-xs md:text-sm mt-1">
          Dianalisis menggunakan kalkulasi matematika probabilitas &amp; statistik performa tim.[span_0](start_span)[span_0](end_span)
        </p>
      </div>
      <div class="flex items-center gap-3 bg-pro-header px-4 py-2.5 rounded border border-pro-border self-start md:self-auto">
        <span class="w-2.5 h-2.5 rounded-full bg-pro-green animate-pulse"></span>
        <div class="text-xs">
          <div class="text-slate-400 uppercase font-semibold text-[10px]">Rilis Harian</div>
          <div id="last-update" class="font-bold text-pro-accent font-mono">Memuat data...</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Daftar Pertandingan -->
  <main class="max-w-5xl mx-auto px-4 pb-16">
    <div id="match-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div class="p-5 bg-pro-card rounded-lg border border-pro-border animate-pulse h-36"></div>
      <div class="p-5 bg-pro-card rounded-lg border border-pro-border animate-pulse h-36"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
