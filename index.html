<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ParlayIQ - Analisis Prediksi Sepak Bola</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            organic: {
              bg: '#fcfbf7',        /* Soft Warm Cream */
              card: '#ffffff',      /* Clean Pure White */
              text: '#1c1917',      /* Warm Charcoal */
              muted: '#78716c',     /* Warm Muted Gray */
              border: '#e7e5e4',    /* Soft Border */
              accent: '#2d5a27',    /* Forest / Organic Green */
              accentBg: '#f2f7f1'  /* Light Soft Green Tint */
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-organic-bg text-organic-text min-h-screen font-sans antialiased">

  <!-- Header / Navbar Clean -->
  <header class="bg-organic-card border-b border-organic-border sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <span class="text-xl font-bold tracking-tight text-organic-text">ParlayIQ</span>
        <span class="text-xs text-organic-muted border-l border-organic-border pl-3 hidden sm:inline">Data & Analisis Bola</span>
      </div>
      <nav class="flex space-x-6 text-sm font-medium">
        <a href="index.html" class="text-organic-accent border-b-2 border-organic-accent pb-1">Hari Ini</a>
        <a href="history.html" class="text-organic-muted hover:text-organic-text transition">Riwayat Win Rate</a>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="max-w-4xl mx-auto px-6 pt-10 pb-6 text-center">
    <h1 class="text-2xl md:text-3xl font-bold text-organic-text tracking-tight">10 Partai Terpilih Hari Ini</h1>
    <p class="text-organic-muted text-sm mt-2 max-w-lg mx-auto leading-relaxed">
      Disaring setiap hari jam 11.00 WIB berdasarkan kalkulasi statistik performa dan matematika probabilitas.[span_0](start_span)[span_0](end_span)
    </p>
    <div class="mt-4 inline-flex items-center gap-2 text-xs text-organic-muted bg-organic-card px-3 py-1.5 rounded-full border border-organic-border shadow-sm">
      <span class="w-2 h-2 rounded-full bg-organic-accent"></span>
      Diperbarui: <span id="last-update" class="font-semibold text-organic-text">Memuat data...</span>
    </div>
  </section>

  <!-- Main Content / Match List -->
  <main class="max-w-4xl mx-auto px-6 pb-20">
    <div id="match-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <!-- Loading Skeleton -->
      <div class="p-6 bg-organic-card rounded-2xl border border-organic-border animate-pulse h-40"></div>
      <div class="p-6 bg-organic-card rounded-2xl border border-organic-border animate-pulse h-40"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
