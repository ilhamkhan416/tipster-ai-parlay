<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIXSCORE PRO - Analysis & Football Handicapping</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <!-- Header Aplikasi -->
    <header class="app-header">
      <div class="brand-title">
        FIXSCORE <span>PRO</span>
      </div>
      <div id="last-updated" style="font-size: 11px; color: var(--text-secondary); font-weight: 600;">
        Diperbarui: -
      </div>
    </header>

    <!-- Navigation Tab -->
    <div style="display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
      <button id="tab-today" style="background: var(--accent-red); color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: 700; font-size: 12px; cursor: pointer;">
        Rekomendasi Hari Ini
      </button>
      <button id="tab-history" style="background: transparent; color: var(--text-secondary); border: none; padding: 6px 12px; border-radius: 4px; font-weight: 700; font-size: 12px; cursor: pointer;">
        History Rekap
      </button>
    </div>

    <!-- Container Utama untuk Kartu Match -->
    <main id="parlay-container">
      <div style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 13px;">
        Memuat analisis pertandingan hari ini...
      </div>
    </main>
  </div>

  <!-- Script Penampil Data -->
  <script src="src/app.js"></script>
</body>
</html>
