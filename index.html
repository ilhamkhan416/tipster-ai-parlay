<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIXSCORE PRO - Live Sports Handicapping & Analytics</title>
  
  <!-- CSS Utama Flashscore Style -->
  <link rel="stylesheet" href="style.css">
  
  <!-- Font Standard High Readability -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    
    <!-- Header Aplikasi Hitam Akses Flashscore -->
    <header class="app-header">
      <div class="brand-title">
        FIXSCORE <span>PRO</span>
      </div>
      <div id="last-updated" style="font-size: 10px; color: #BBBBBB; font-weight: 500;">
        UPDATED: -
      </div>
    </header>

    <!-- Navigasi Utama Tab (Rekomendasi vs History) -->
    <div style="background: #1A212A; padding: 0 8px 8px 8px; display: flex; gap: 4px; border-bottom: 2px solid var(--accent-red);">
      <button id="tab-today" style="flex: 1; background: var(--accent-red); color: #FFFFFF; border: none; padding: 8px 0; font-weight: 700; font-size: 11px; cursor: pointer; text-transform: uppercase; border-radius: 2px;">
        Rekomendasi Hari Ini
      </button>
      <button id="tab-history" style="flex: 1; background: transparent; color: #AAAAAA; border: none; padding: 8px 0; font-weight: 700; font-size: 11px; cursor: pointer; text-transform: uppercase; border-radius: 2px;">
        History Rekap (Status)
      </button>
    </div>

    <!-- Main Container Tempat Render Kartu Match -->
    <main id="parlay-container" style="margin-top: 8px;">
      <div style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 12px; font-weight: 500;">
        Memuat data pertandingan & analisis pasaran...
      </div>
    </main>

  </div>

  <!-- JavaScript Controller -->
  <script src="src/app.js"></script>
</body>
</html>
