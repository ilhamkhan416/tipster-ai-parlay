<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIXSCORE PRO - Live Sports Handicapping & Analytics</title>
  
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-wrapper">
    
    <!-- Top Bar Navigation Flashscore Style -->
    <header class="main-header">
      <div class="brand">
        FIXSCORE <span class="badge-pro">PRO</span>
      </div>
      <div id="last-updated" class="update-time">
        UPDATED: -
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="nav-tabs">
      <button id="tab-today" class="tab-btn active">Rekomendasi Hari Ini</button>
      <button id="tab-history" class="tab-btn">History Rekap</button>
    </nav>

    <!-- Main Content Container -->
    <main id="parlay-container" class="content-body">
      <div class="loading-state">
        Memuat data pertandingan & analisis pasaran...
      </div>
    </main>

  </div>

  <script src="src/app.js"></script>
</body>
</html>
